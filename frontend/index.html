<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityGuard - Citizen Reporter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div>
            <h1>🚦 CITYGUARD</h1>
            <p>AI Smart City Command Center</p>
        </div>

        <a href="admin.html" class="admin-link">
            Admin Dashboard
        </a>

    </header>


    <main class="container">

        <section class="hero">

            <h2>Report a City Problem</h2>

            <p>
                Help make your city safer by reporting potholes,
                garbage, damaged roads and other civic problems.
            </p>

        </section>


        <section class="card">

            <h2>Submit a Report</h2>

            <form id="reportForm">

                <label>Problem Title</label>

                <input type="text" id="title" placeholder="Example: Large pothole" required>


                <label>Description</label>

                <textarea id="description" placeholder="Describe the problem..." required></textarea>


                <label>Location</label>

                <input type="text" id="location" placeholder="Example: Madhapur" required>


                <label>Severity</label>

                <select id="severity">

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>


                <label>Upload Photo</label>

                <input type="file" id="image" accept="image/*" required>


                <div id="imagePreviewContainer" class="image-preview-container">

                    <img id="imagePreview" alt="Selected image preview">

                </div>


                <button type="submit" class="submit-button">
                    🚨 Submit Report
                </button>

            </form>


            <div id="message" class="message"></div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
