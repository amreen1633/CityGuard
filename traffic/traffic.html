<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CityGuard - Traffic Management</title>

    <link rel="stylesheet" href="traffic.css">

</head>


<body>

    <header>

        <h1>🚦 CITYGUARD</h1>

        <p>Adaptive Traffic Management</p>

    </header>


    <main>

        <section class="dashboard">

            <h2>Traffic Control Center</h2>

            <p>
                Simulated traffic intersection
            </p>


            <div class="stats">

                <div class="stat">

                    <h3>Traffic Level</h3>

                    <p id="trafficLevel">
                        LOW
                    </p>

                </div>


                <div class="stat">

                    <h3>Vehicles</h3>

                    <p id="vehicleCount">
                        3
                    </p>

                </div>


                <div class="stat">

                    <h3>Signal</h3>

                    <p id="signalStatus">
                        GREEN
                    </p>

                </div>

            </div>


            <!-- Traffic intersection -->

            <div class="intersection">

                <div class="road horizontal">

                    <div class="car car1">🚗</div>

                    <div class="car car2">🚙</div>

                    <div class="car car3">🚕</div>

                    <div class="car car4">🚗</div>

                    <div class="car car5">🚙</div>

                </div>


                <div class="road vertical"></div>


                <!-- Traffic signal -->

                <div class="traffic-light">

                    <div id="redLight" class="light red"></div>

                    <div id="yellowLight" class="light yellow"></div>

                    <div id="greenLight" class="light green active"></div>

                </div>

            </div>


            <!-- Controls -->

            <div class="controls">

                <button id="increaseBtn">
                    ➕ Increase Traffic
                </button>

                <button id="decreaseBtn">
                    ➖ Reduce Traffic
                </button>

                <button id="emergencyBtn" class="emergency">
                    🚑 Emergency Mode
                </button>

            </div>


            <div id="message" class="message">
                Normal traffic operation
            </div>

        </section>

    </main>


    <script src="traffic.js"></script>

</body>

</html>
